[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "htmlsnap"
version = "0.1.0"
description = "High-performance HTML-to-image rendering for Python using Ultralight — generate production-grade screenshots, component snapshots, visual previews, and automated render pipelines."
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
htmlsnap = "htmlsnap.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
htmlsnap = [
    "libs/**/*"
]